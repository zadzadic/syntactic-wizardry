plugins {
 id 'java-library'
 id 'maven-publish'
 id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir('src/generated/resources') }

repositories {
 maven {
  name = 'GeckoLib'
  url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
 }
}

dependencies {
 implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.7.5.1"
}
neoForge {
 version = project.neo_version
 parchment { mappingsVersion = project.parchment_mappings_version; minecraftVersion = project.parchment_minecraft_version }
 mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
 var replaceProperties = [minecraft_version:minecraft_version,minecraft_version_range:minecraft_version_range,neo_version:neo_version,loader_version_range:loader_version_range,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version]
 inputs.properties replaceProperties
 expand replaceProperties
 from "src/main/templates"
 into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }\n
def componentIconAtlasFile = file("$buildDir/generated/component-icons/component_atlas.png")
tasks.register("generateComponentIconAtlas") {
 inputs.files((0..3).collect { file("component-icons/atlas_" + it + ".b64") })
 outputs.file(componentIconAtlasFile)
 doLast {
  componentIconAtlasFile.parentFile.mkdirs()
  def encoded = (0..3).collect { file("component-icons/atlas_" + it + ".b64").text.trim() }.join()
  componentIconAtlasFile.bytes = encoded.decodeBase64()
 }
}
tasks.named("processResources") {
 dependsOn "generateComponentIconAtlas"
 from(componentIconAtlasFile) {
  into "assets/syntacticwizardry/textures/item/component_icons"
 }
}


// The Arcane Builder is transplanted byte-for-byte from the proven 0.4.267 implementation.
sourceSets.main.compileClasspath += files('prebuilt-builder')
sourceSets.main.runtimeClasspath += files('prebuilt-builder')
sourceSets.main.output.dir(file('prebuilt-builder'))
