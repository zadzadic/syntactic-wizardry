name: Build Syntactic Wizardry
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: syntactic-wizardry-0.1.0
          path: build/libs/*.jar
          if-no-files-found: error
