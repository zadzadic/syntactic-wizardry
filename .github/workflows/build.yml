name: Build Syntactic Wizardry v0.1.87 internal collision
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inject v0.1.87 source
        run: |
          rm -rf src/main/java src/main/templates
          rm -f build.gradle settings.gradle gradle.properties
          cat build_payload_part_*.b64 | base64 -d | tar -xzf -
          patch -p1 < build_v0_1_87_internal_collision.patch
          test "$(grep '^mod_version=' gradle.properties | cut -d= -f2)" = "0.1.87"
      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Install Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: syntactic-wizardry-${{ env.MOD_VERSION }}
          path: build/libs/*.jar
          if-no-files-found: error
