name: Build Syntactic Wizardry
on:
  workflow_dispatch:
  push:
    branches: [ main, chatgpt-luminal-v0.2.28-build, chatgpt-luminal-v0.2.29-render, chatgpt-luminal-v0.2.30-los, chatgpt-luminal-v0.2.31-color, chatgpt-luminal-v0.2.42-world-lighting, chatgpt-luminal-v0.2.43-context-lighting, chatgpt-luminal-v0.2.45-front-air-projection, chatgpt-luminal-v0.2.46-horizontal-basis, chatgpt-luminal-v0.2.47-cache-swirl, chatgpt-luminal-v0.2.49-fixed-cache-camera-preserved, chatgpt-luminal-v0.2.50-entities, chatgpt-luminal-v0.2.51-projectiles, chatgpt-luminal-v0.2.52-impact-bypass ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply v0.2.28 working patch
        if: ${{ hashFiles('.build/luminal-v0.2.28.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.28.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.28.patch
          git apply /tmp/luminal-v0.2.28.patch
      - name: Apply v0.2.29 render patch
        if: ${{ hashFiles('.build/luminal-v0.2.29-render.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.29-render.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.29-render.patch
          git apply /tmp/luminal-v0.2.29-render.patch
      - name: Apply v0.2.30 line-of-sight patch
        if: ${{ hashFiles('.build/luminal-v0.2.30-los.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.30-los.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.30-los.patch
          git apply /tmp/luminal-v0.2.30-los.patch
      - name: Apply v0.2.31 portal color patch
        if: ${{ hashFiles('.build/luminal-v0.2.31-color.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.31-color.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.31-color.patch
          git apply /tmp/luminal-v0.2.31-color.patch
      - name: Apply v0.2.42 world lighting patch
        if: ${{ hashFiles('.build/luminal-v0.2.42-world-lighting.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.42-world-lighting.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.42-world-lighting.patch
          git apply /tmp/luminal-v0.2.42-world-lighting.patch
      - name: Apply v0.2.43 lighting context patch
        if: ${{ hashFiles('.build/luminal-v0.2.43-context-lighting.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.43-context-lighting.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.43-context-lighting.patch
          git apply /tmp/luminal-v0.2.43-context-lighting.patch
      - name: Apply v0.2.45 front-air projection patch
        if: ${{ hashFiles('.build/luminal-v0.2.45-front-air-projection.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.45-front-air-projection.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.45-front-air-projection.patch
          git apply /tmp/luminal-v0.2.45-front-air-projection.patch
      - name: Apply v0.2.46 horizontal basis patch
        if: ${{ hashFiles('.build/luminal-v0.2.46-horizontal-basis.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.46-horizontal-basis.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.46-horizontal-basis.patch
          git apply /tmp/luminal-v0.2.46-horizontal-basis.patch
      - name: Apply v0.2.47 cache and edge swirl patch
        if: ${{ hashFiles('.build/luminal-v0.2.47-cache-swirl.patch.gz.b64') != '' }}
        run: |
          cat .build/luminal-v0.2.47-cache-swirl.part0 .build/luminal-v0.2.47-cache-swirl.part1 .build/luminal-v0.2.47-cache-swirl.part2 .build/luminal-v0.2.47-cache-swirl.part3 | base64 -d | gzip -d > /tmp/luminal-v0.2.47-cache-swirl.patch
          git apply /tmp/luminal-v0.2.47-cache-swirl.patch
      - name: Apply v0.2.49 fixed cache patch
        if: ${{ hashFiles('.build/luminal-v0.2.49-fixed-cache.part0') != '' }}
        run: |
          cat .build/luminal-v0.2.49-fixed-cache.part0 .build/luminal-v0.2.49-fixed-cache.part1 .build/luminal-v0.2.49-fixed-cache.part2 .build/luminal-v0.2.49-fixed-cache.part3 | base64 -d | gzip -d > /tmp/luminal-v0.2.49-fixed-cache.patch
          git apply /tmp/luminal-v0.2.49-fixed-cache.patch
      - name: Apply v0.2.50 entity rendering patch
        if: ${{ hashFiles('.build/luminal-v0.2.50-entities.part0') != '' }}
        run: |
          cat .build/luminal-v0.2.50-entities.part0 .build/luminal-v0.2.50-entities.part1 .build/luminal-v0.2.50-entities.part2 .build/luminal-v0.2.50-entities.part3 | base64 -d | gzip -d > /tmp/luminal-v0.2.50-entities.patch
          git apply /tmp/luminal-v0.2.50-entities.patch
      - name: Apply v0.2.50 entity query fix
        if: ${{ hashFiles('.build/luminal-v0.2.50-entities-fix.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.50-entities-fix.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.50-entities-fix.patch
          git apply /tmp/luminal-v0.2.50-entities-fix.patch
      - name: Apply v0.2.51 projectile gateway patch
        if: ${{ hashFiles('.build/luminal-v0.2.51-projectiles.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.51-projectiles.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.51-projectiles.patch
          git apply /tmp/luminal-v0.2.51-projectiles.patch
      - name: Apply v0.2.51 projectile service source
        if: ${{ hashFiles('.build/luminal-v0.2.51-projectiles-newfile.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.51-projectiles-newfile.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.51-projectiles-newfile.patch
          git apply /tmp/luminal-v0.2.51-projectiles-newfile.patch
      - name: Apply v0.2.52 projectile impact bypass patch
        if: ${{ hashFiles('.build/luminal-v0.2.52-impact-bypass.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/luminal-v0.2.52-impact-bypass.patch.gz.b64 | gzip -d > /tmp/luminal-v0.2.52-impact-bypass.patch
          git apply /tmp/luminal-v0.2.52-impact-bypass.patch
      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Install Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build
        run: gradle build --stacktrace
      - name: Package source
        run: |
          SOURCE_ZIP="syntactic-magic-development.${MOD_VERSION}.zip"
          rm -rf .build
          zip -qr "$SOURCE_ZIP" . \
            -x ".git/*" "build/*" "gradle-9.2.1/*" "gradle-9.2.1-bin.zip" "$SOURCE_ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: syntactic-wizardry-${{ env.MOD_VERSION }}
          path: |
            build/libs/*.jar
            syntactic-magic-development.${{ env.MOD_VERSION }}.zip
          if-no-files-found: error
