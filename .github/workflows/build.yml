        run: |
          base64 -d .build/ritual-v0.2.56-clear-skies-compilefix.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.56-clear-skies-compilefix.patch
          git apply /tmp/ritual-v0.2.56-clear-skies-compilefix.patch
      - name: Apply v0.2.57 Stormlord ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.57-stormlord.part0') != '' }}
        run: |
          cat .build/ritual-v0.2.57-stormlord.part0 .build/ritual-v0.2.57-stormlord.part1 .build/ritual-v0.2.57-stormlord.part2 | base64 -d | gzip -d > /tmp/ritual-v0.2.57-stormlord.patch
          git apply /tmp/ritual-v0.2.57-stormlord.patch
      - name: Apply v0.2.58 local Stormlord weather patch
        if: ${{ hashFiles('.build/ritual-v0.2.58-stormlord-local.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.58-stormlord-local.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.58-stormlord-local.patch
          git apply /tmp/ritual-v0.2.58-stormlord-local.patch
      - name: Apply v0.2.59 weather lifecycle fixes
        if: ${{ hashFiles('.build/ritual-v0.2.59-weather-lifecycle.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.59-weather-lifecycle.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.59-weather-lifecycle.patch
          git apply /tmp/ritual-v0.2.59-weather-lifecycle.patch
      - name: Apply v0.2.60 Ice Crown and ritual Size patch
        if: ${{ hashFiles('.build/ritual-v0.2.60-ice-crown-size.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.60-ice-crown-size.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.60-ice-crown-size.patch
          git apply /tmp/ritual-v0.2.60-ice-crown-size.patch
      - name: Apply v0.2.60 Ice Crown new source files
        if: ${{ hashFiles('.build/ritual-v0.2.60-ice-crown-size-newfiles.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.60-ice-crown-size-newfiles.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.60-ice-crown-size-newfiles.patch
          git apply /tmp/ritual-v0.2.60-ice-crown-size-newfiles.patch
      - name: Apply v0.2.61 Consecrate ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.61-consecrate.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.61-consecrate.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.61-consecrate.patch
          git apply /tmp/ritual-v0.2.61-consecrate.patch
      - name: Apply v0.2.62 Alter Biome ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.62-alter-biome.part00') != '' }}
        run: |
          cat .build/ritual-v0.2.62-alter-biome.part00 .build/ritual-v0.2.62-alter-biome.part01 .build/ritual-v0.2.62-alter-biome.part02 .build/ritual-v0.2.62-alter-biome.part03 | base64 -d | gzip -d > /tmp/ritual-v0.2.62-alter-biome.patch
          git apply /tmp/ritual-v0.2.62-alter-biome.patch
      - name: Apply v0.2.63 Anchor ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.63-anchor.part00') != '' }}
        run: |
          cat .build/ritual-v0.2.63-anchor.part00 .build/ritual-v0.2.63-anchor.part01 .build/ritual-v0.2.63-anchor.part02 .build/ritual-v0.2.63-anchor.part03 .build/ritual-v0.2.63-anchor.part04 | base64 -d | gzip -d > /tmp/ritual-v0.2.63-anchor.patch
          git apply /tmp/ritual-v0.2.63-anchor.patch
      - name: Apply v0.2.64 Seek ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.64-seek.part00') != '' }}
        run: |
          cat .build/ritual-v0.2.64-seek.part00 | base64 -d | gzip -d > /tmp/ritual-v0.2.64-seek.patch
          git apply /tmp/ritual-v0.2.64-seek.patch
      - name: Apply v0.2.64 Seek source files
        if: ${{ hashFiles('.build/ritual-v0.2.64-seek-newfiles.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.64-seek-newfiles.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.64-seek-newfiles.patch
          git apply /tmp/ritual-v0.2.64-seek-newfiles.patch
      - name: Apply v0.2.65 Seek compass fixes
        if: ${{ hashFiles('.build/ritual-v0.2.65-seek-compass-fix.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.65-seek-compass-fix.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.65-seek-compass-fix.patch
          git apply /tmp/ritual-v0.2.65-seek-compass-fix.patch
      - name: Apply v0.2.66 Verdancy ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.66-verdancy.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.66-verdancy.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.66-verdancy.patch
          git apply /tmp/ritual-v0.2.66-verdancy.patch
      - name: Apply v0.2.67 Armillary area position fix
        if: ${{ hashFiles('.build/ritual-v0.2.67-area-position.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.67-area-position.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.67-area-position.patch
          git apply /tmp/ritual-v0.2.67-area-position.patch
      - name: Apply v0.2.68 Armillary drag/outline patch
        if: ${{ hashFiles('.build/ritual-v0.2.68-armillary-drag-outline.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.68-armillary-drag-outline.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.68-armillary-drag-outline.patch
          git apply /tmp/ritual-v0.2.68-armillary-drag-outline.patch
      - name: Apply v0.2.68 drag helper fix
        if: ${{ hashFiles('.build/ritual-v0.2.68-armillary-drag-fix.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.68-armillary-drag-fix.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.68-armillary-drag-fix.patch
          git apply /tmp/ritual-v0.2.68-armillary-drag-fix.patch
      - name: Apply v0.2.69 Armillary face resize patch
        if: ${{ hashFiles('.build/ritual-v0.2.69-armillary-face-resize.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.69-armillary-face-resize.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.69-armillary-face-resize.patch
          git apply /tmp/ritual-v0.2.69-armillary-face-resize.patch
      - name: Apply v0.2.70 Armillary GUI patch
        if: ${{ hashFiles('.build/ritual-v0.2.70-armillary-gui.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.70-armillary-gui.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.70-armillary-gui.patch
          git apply /tmp/ritual-v0.2.70-armillary-gui.patch
      - name: Apply v0.2.71 Deluge ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.71-deluge.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.71-deluge.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.71-deluge.patch
          git apply /tmp/ritual-v0.2.71-deluge.patch
      - name: Apply v0.2.72 Armillary area decoupling patch
        if: ${{ hashFiles('.build/ritual-v0.2.72-area-decoupling.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.72-area-decoupling.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.72-area-decoupling.patch
          git apply /tmp/ritual-v0.2.72-area-decoupling.patch
      - name: Apply v0.2.73 Drought ritual patch
        if: ${{ hashFiles('.build/ritual-v0.2.73-drought.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.73-drought.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.73-drought.patch
          git apply /tmp/ritual-v0.2.73-drought.patch
      - name: Apply v0.2.74 Pedestal patch
        if: ${{ hashFiles('.build/ritual-v0.2.74-pedestal.patch.gz.b64') != '' }}
        run: |
          base64 -d .build/ritual-v0.2.74-pedestal.patch.gz.b64 | gzip -d > /tmp/ritual-v0.2.74-pedestal.patch
          git apply /tmp/ritual-v0.2.74-pedestal.patch
      - name: Read mod version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Install Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> "$GITHUB_PATH"
      - name: Build
        run: gradle build --stacktrace
      - name: Package source
        run: |
          SOURCE_ZIP="syntactic-magic-development.${MOD_VERSION}.zip"
          rm -rf .build
          zip -qr "$SOURCE_ZIP" . \
            -x ".git/*" "build/*" "gradle-9.2.1/*" "gradle-9.2.1-bin.zip" "$SOURCE_ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: syntactic-wizardry-${{ env.MOD_VERSION }}
          path: |
            build/libs/*.jar
            syntactic-magic-development.${{ env.MOD_VERSION }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: syntactic-wizardry-${{ env.MOD_VERSION }}-release
          path: build/libs/*.jar
          if-no-files-found: error
