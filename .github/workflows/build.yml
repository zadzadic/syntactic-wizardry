          git apply /tmp/luminal-v0.2.54-light-context.patch
      - name: Apply v0.2.55 prepared ritual rotation patch
        if: ${{ hashFiles('.build/ritual-v0.2.55-rotation.patch.gz.b64') != '' }}
        run: |
